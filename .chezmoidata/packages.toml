# Packages for Arch Linux and EndeavourOS, installed by
# run_onchange_before_15-install-arch-packages. Other distributions install nothing.
#
# Which tables are installed:
#   packages.base             every Arch-based machine
#   packages.hardware         unless running under WSL (kernel, boot, firmware, network, audio)
#   packages.desktop          only with gui = true
#   packages.desktops.<name>  for each name in desktops (only with gui = true)
#   packages.groups.<name>    for each name in packageGroups
#
# Each table has pacman and aur lists, and may have sub-tables that add more:
#   <table>.gui           only with gui = true
#   <table>.endeavouros   only on EndeavourOS (its own repository has these)
# Sub-tables can nest, e.g. packages.desktop.endeavouros.

[packages.base]
pacman = [
  "base",
  "base-devel",
  "logrotate",
  "pacman-contrib",
  "reflector",
  "sudo",
  "systemd-sysvcompat",

  # shell
