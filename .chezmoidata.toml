# Defaults for keys that `chezmoi init` asks for. An old config without
# them still applies; values in chezmoi.toml take precedence.
skk = true
private = false
desktops = ["i3", "sway"]
packageGroups = ["apps", "dev", "android", "cli", "tex"]

# Shared GTK appearance settings. Cursor and scaling follow below.
[gtk]
gtk-theme-name = "Arc-Dark"
gtk-icon-theme-name = "Qogir-Dark"
gtk-font-name = "Noto Sans 10"
gtk-toolbar-style = "GTK_TOOLBAR_ICONS"
gtk-toolbar-icon-size = "GTK_ICON_SIZE_LARGE_TOOLBAR"
gtk-button-images = 0
gtk-menu-images = 0
gtk-enable-event-sounds = 1
gtk-enable-input-feedback-sounds = 0
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = "hintslight"
gtk-xft-rgba = "rgb"
gtk-application-prefer-dark-theme = 1

# The cursor size is logical: the output scale below multiplies it.
# Kiritan is built locally by install-kiritan-cursor (see README).
[cursor]
theme = "Kiritan"
size = 32

# Per-monitor preferences shared by sway and i3, keyed by the monitor rather
# than the machine. make/model/serial follow `swaymsg -t get_outputs`.
# Unlisted monitors keep scale 1 and their preferred mode.
[[monitors]]
make = "Samsung Display Corp."
model = "ATNA40HQ02-0"
serial = "Unknown"
scale = 1.25
mode = "2880x1800@60Hz"
